services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy
      POSTGRES_DB: academy
    ports:
      - "5432:5432"
    volumes:
      - academy-pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d academy"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  academy-pg:
